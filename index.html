    <!-- 加在 <body> 最頂部，#root 之前 -->
    <div id="boot-screen" style="
      position:fixed; inset:0; background:#000;
      display:flex; align-items:center; justify-content:center;
      z-index:9999; font-family:monospace; color:#0ef;
      flex-direction:column; gap:16px; pointer-events:none;
    ">
      <div style="font-size:1.4rem; letter-spacing:4px; font-weight:bold;">SPARKBODY STAGE</div>
      <div style="font-size:0.8rem; opacity:0.5; letter-spacing:2px;">Loading assets...</div>
      <div style="
        width:120px; height:2px; background:rgba(0,239,255,0.15); border-radius:2px; overflow:hidden;
      ">
        <div style="
          height:100%; background:#0ef; border-radius:2px;
          animation: boot-bar 2s ease-in-out infinite alternate;
        "></div>
      </div>
    </div>
    <style>
      @keyframes boot-bar {
        from { width: 0%; }
        to   { width: 100%; }
      }
    </style>
    <script>
      window.__removeBoot = () => {
        const el = document.getElementById("boot-screen");
        if (!el) return;
        el.style.transition = "opacity 0.4s";
        el.style.opacity = "0";
        setTimeout(() => el.remove(), 400);
      };
    </script>

  <body>
    <div id="root"></div>
